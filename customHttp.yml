# AWS Amplify Hosting のカスタムヘッダー。
# public/ 配下の静的ファイル(動画・写真・フォント・生成サムネイル)は Amplify の
# 静的配信層から返るため next.config.mjs の headers() が効かず、既定の
# max-age=5 で配られていた(2026-08-22 確認)。ここで CDN 側のキャッシュを指定する。
# HTML(SSR 応答)のセキュリティヘッダーは next.config.mjs が担当。
customHeaders:
  - pattern: '**/*.mp4'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=2592000, stale-while-revalidate=86400'
  - pattern: '**/*.webp'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=2592000, stale-while-revalidate=86400'
  - pattern: '**/*.jpg'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=2592000, stale-while-revalidate=86400'
  - pattern: '**/*.svg'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=2592000, stale-while-revalidate=86400'
  - pattern: '**/*.woff2'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/menu-thumbs/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/llms.txt'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=3600'
