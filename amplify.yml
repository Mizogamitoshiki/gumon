# AWS Amplify Hosting ビルド仕様(愚問 GUMON / Next.js 14 App Router)
# 前提:
#  - 全ルート静的プリレンダー・next/image 不使用・API/middleware なし(静的配信可)
#  - `npm run build` の prebuild フックで scripts/sync-menu.mjs が Bloom-lCMS から
#    メニューを取得して src/lib/menu.generated.ts を再生成する
#  - そのため Amplify コンソールの環境変数に BLOOM_API_URL / BLOOM_API_KEY が
#    必須(未設定だと prebuild が exit 1 でビルド失敗)。正規URL用に
#    NEXT_PUBLIC_SITE_URL=https://gumon0624.com も設定済み
#    (未設定時は src/lib/site.ts のフォールバック=同値を使う)
#  - CMS でメニューを更新したら再ビルドが必要(Bloom-lCMS の Webhook に
#    Amplify の Incoming Webhook を登録済み。publish で自動再ビルドされる)
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
